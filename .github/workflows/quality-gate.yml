name: quality-gate

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .nvmrc
      - .github/workflows/quality-gate.yml
  pull_request:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .nvmrc
      - .github/dependabot.yml
      - .github/workflows/**
      - scripts/ci/run-quality-gate.mjs
      - test/toolchain-contract.test.mjs
      - test/helpers/cli-business-installed.ts

permissions:
  contents: read

concurrency:
  group: cli-quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gate:
    name: quality-gate (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            primary: true
          - os: windows-latest
            platform: win32
            arch: x64
            primary: false
          - os: macos-latest
            platform: darwin
            arch: arm64
            primary: false
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            primary: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24.19.0
          install: false
          cache: true

      - name: Assert runner platform and architecture
        run: node ./scripts/ci/assert-runtime-platform.cjs --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Windows bootstrap HTTP behavior
        if: runner.os == 'Windows'
        run: pnpm exec tsx --test test/runtime-bootstrap-http.test.ts

      - name: Run quality gate
        run: node ./scripts/ci/run-quality-gate.mjs ${{ matrix.primary && '--primary' || '' }}

name: Publish Package

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing cli-v* tag to release with the current workflow definition.
        required: true
        type: string
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

jobs:
  release-context:
    name: Release Context
    runs-on: ubuntu-latest
    outputs:
      release_base: ${{ steps.release.outputs.release_base }}
      release_head: ${{ steps.release.outputs.release_head }}
      should_release: ${{ steps.release.outputs.should_release }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.19.0
          install: false
          cache: true

      - name: Fetch main and tags
        run: |
          git fetch --force origin +refs/heads/main:refs/remotes/origin/main
          git fetch --force origin '+refs/tags/*:refs/tags/*'

      - name: Resolve release target
        id: release
        env:
          REQUESTED_TAG_NAME: ${{ github.event.inputs.tag_name || '' }}
          EXPECTED_REPOSITORY: tiangong-lca/cli
          EXPECTED_REPOSITORY_ID: '1194220834'
          EXPECTED_REPOSITORY_OWNER_ID: '327771381'
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          EVENT_COMMIT_SHA: ${{ github.sha }}
          EVENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: bash scripts/ci/release-context.sh

  release-gate:
    name: Release Gate
    needs: release-context
    if: needs.release-context.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.release_head }}
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --force origin +refs/heads/main:refs/remotes/origin/main

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install docpact
        run: cargo install docpact --version 0.1.9 --force

      - name: Run docpact release gate
        run: |
          set -euo pipefail
          release_head="${{ needs.release-context.outputs.release_head }}"
          release_base="${{ needs.release-context.outputs.release_base }}"
          scripts/docpact-gate.sh --base "$release_base" --head "$release_head"

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.19.0
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full pre-publish gate
        run: pnpm run prepush:gate

  npm-publish:
    name: Publish npm package
    needs:
      - release-context
      - release-gate
    if: needs.release-context.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-context.outputs.release_head }}

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.19.0
          install: false
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: node ./scripts/ci/check-release-tag.cjs cli "${{ needs.release-context.outputs.tag_name }}"

      - name: Check npm registry version availability
        run: node ./scripts/ci/release-version.cjs assert-unpublished

      - name: Build package artifacts
        run: pnpm run build

      - name: Verify package
        run: pnpm --filter @tiangong-lca/cli --fail-if-no-match pack --dry-run >/dev/null

      - name: Publish to npm
        run: pnpm --filter @tiangong-lca/cli --fail-if-no-match publish --access public --provenance --no-git-checks

name: Tag Release From Merge

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-context:
    if: >-
      github.repository == 'tiangong-lca/cli' && github.repository_id == '1194220834' && github.repository_owner_id == '327771381'
    runs-on: ubuntu-latest
    outputs:
      cli_changed: ${{ steps.release.outputs.cli_changed }}
      cli_tag: ${{ steps.release.outputs.cli_tag }}
      cli_version: ${{ steps.release.outputs.cli_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.19.0
          install: false
          cache: true

      - name: Detect release version changes
        id: release
        env:
          BASE_REF: ${{ github.event.before }}
          HEAD_REF: ${{ github.sha }}
        run: |
          node ./scripts/ci/detect-release-changes.cjs \
            --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF"

  quality-gate:
    needs: release-context
    if: needs.release-context.outputs.cli_changed == 'true'
    uses: ./.github/workflows/quality-gate.yml

  tag-release:
    needs:
      - release-context
      - quality-gate
    if: >-
      github.repository == 'tiangong-lca/cli' && github.repository_id == '1194220834' && github.repository_owner_id == '327771381' && needs.release-context.outputs.cli_changed == 'true' && needs.quality-gate.result == 'success'


    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TIANGONG_CLI_RELEASE_AUTOMATION_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install docpact
        run: cargo install docpact --version 0.1.9 --force

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.19.0
          install: false
          cache: true

      - name: Validate automation token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "error: missing TIANGONG_CLI_RELEASE_AUTOMATION_TOKEN secret" >&2
            exit 1
          fi

      - name: Run docpact release gate before tag
        env:
          BASE_REF: ${{ github.event.before }}
          HEAD_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
            BASE_REF="${HEAD_REF}^"
          fi
          scripts/docpact-gate.sh --base "$BASE_REF" --head "$HEAD_REF"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gate before tag
        run: pnpm run prepush:gate

      - name: Check npm registry version availability
        env:
          CLI_VERSION: ${{ needs.release-context.outputs.cli_version }}
        run: |
          node ./scripts/ci/release-version.cjs assert-unpublished \
            --version "$CLI_VERSION"

      - name: Enforce publication floor
        env:
          CLI_VERSION: ${{ needs.release-context.outputs.cli_version }}
        run: node ./scripts/ci/check-publication-floor.cjs "$CLI_VERSION"

      - name: Create release tag
        env:
          TAG_NAME: ${{ needs.release-context.outputs.cli_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          existing_sha=""
          if existing_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" \
              --jq '.object.sha' 2>/dev/null
          )"; then
            :
          else
            existing_sha=""
          fi

          if [ -n "$existing_sha" ]; then
            if [ "$existing_sha" = "$TARGET_SHA" ]; then
              echo "::notice::Tag ${TAG_NAME} already points to ${TARGET_SHA}; continuing."
              {
                echo "### Release tag"
                echo "- tag: \`${TAG_NAME}\`"
                echo "- target: \`${TARGET_SHA}\`"
                echo "- created: \`false\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "error: tag ${TAG_NAME} already points to ${existing_sha}, not ${TARGET_SHA}" >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            --method POST \
            -f ref="refs/tags/${TAG_NAME}" \
            -f sha="${TARGET_SHA}"

          {
            echo "### Release tag"
            echo "- tag: \`${TAG_NAME}\`"
            echo "- target: \`${TARGET_SHA}\`"
            echo "- created: \`true\`"
          } >> "$GITHUB_STEP_SUMMARY"

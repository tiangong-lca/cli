repo:
  id: cli
  owner: cli

rules:
  - id: cli-bootstrap-contract
    scope: repo
    repo: cli
    triggers:
      - path: AGENTS.md
        kind: doc-contract
      - path: .docpact/config.yaml
        kind: doc-governance-layer
      - path: docs/agents/repo-validation.md
        kind: deep-doc
      - path: docs/agents/repo-architecture.md
        kind: deep-doc
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: Repo entry guidance, machine-readable routing, and retained CLI source docs must stay aligned.
  - id: cli-tidas-spec-difference-ledger
    scope: repo
    repo: cli
    triggers:
      - path: docs/agents/tidas-spec-difference-ledger.md
        kind: deep-doc
      - path: docs/agents/tidas-spec-difference-ledger.json
        kind: evidence-ledger
      - path: scripts/ci/compare-tidas-spec.py
        kind: validation-script
      - path: scripts/ci/test-compare-tidas-spec.py
        kind: repo-test
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
    reason: The W6a/A09 semantic-difference ledger must remain reproducible and must not be mistaken for a public asset or release decision.
  - id: cli-readme-contract
    scope: repo
    repo: cli
    triggers:
      - path: README.md
        kind: repo-landing
    requiredDocs:
      - path: AGENTS.md
        mode: must_exist
      - path: .docpact/config.yaml
        mode: must_exist
    reason: User-facing CLI invocation docs should stay aligned with the current public command and package surface.
  - id: cli-maintainer-docs-contract
    scope: repo
    repo: cli
    triggers:
      - path: DEV_CN.md
        kind: maintainer-doc
      - path: docs/IMPLEMENTATION_GUIDE_CN.md
        kind: implementation-guide
      - path: docs/SKILLS_TO_CLI_MIGRATION_CHECKLIST_CN.md
        kind: historical-audit
      - path: docs/TEMP_ISSUE_55_DIRECT_DEPS_TODO_CN.md
        kind: historical-todo
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: DEV_CN.md
        mode: review_or_update
      - path: docs/IMPLEMENTATION_GUIDE_CN.md
        mode: review_or_update
      - path: docs/SKILLS_TO_CLI_MIGRATION_CHECKLIST_CN.md
        mode: must_exist
      - path: docs/TEMP_ISSUE_55_DIRECT_DEPS_TODO_CN.md
        mode: must_exist
    reason: Active maintainer guides must stay aligned, while retained non-auth historical docs remain discoverable without being rewritten for unrelated current-toolchain changes.
  - id: cli-command-surface-contract
    scope: repo
    repo: cli
    triggers:
      - path: bin/**
        kind: launcher
      - path: src/main.ts
        kind: process-entry
      - path: src/cli.ts
        kind: command-router
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
    reason: Launcher, help, exit, and command registration changes alter the public CLI contract.
  - id: cli-command-family-contract
    scope: repo
    repo: cli
    triggers:
      - path: src/lib/artifacts.ts
        kind: artifact-runtime
      - path: src/lib/dataset-command.ts
        kind: command-logic
      - path: src/lib/dataset-*.ts
        kind: command-logic
      - path: src/lib/errors.ts
        kind: shared-runtime
      - path: src/lib/flow-*.ts
        kind: command-logic
      - path: src/lib/identity-preflight.ts
        kind: command-logic
      - path: src/lib/io.ts
        kind: shared-runtime
      - path: src/lib/lifecyclemodel-*.ts
        kind: command-logic
      - path: src/lib/lca-release.ts
        kind: command-logic
      - path: src/lib/package-version.ts
        kind: package-runtime
      - path: src/lib/process-*.ts
        kind: command-logic
      - path: src/lib/publish.ts
        kind: command-logic
      - path: src/lib/review-*.ts
        kind: command-logic
      - path: src/lib/run.ts
        kind: command-logic
      - path: src/lib/runtime-rulesets.ts
        kind: command-logic
      - path: src/lib/state-lock.ts
        kind: artifact-runtime
      - path: src/lib/tidas-languages.ts
        kind: validation-runtime
      - path: src/lib/tidas-sdk-validation.ts
        kind: validation-runtime
      - path: src/lib/tidas-review-report-optionality.ts
        kind: validation-runtime
      - path: src/lib/tidas-sdk-package-validator.ts
        kind: validation-runtime
      - path: src/lib/validation.ts
        kind: validation-runtime
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/IMPLEMENTATION_GUIDE_CN.md
        mode: review_or_update
    reason: Command-family implementation changes affect public command behavior, artifact layout, and validation guidance.
  - id: cli-public-library-contract
    scope: repo
    repo: cli
    triggers:
      - path: package.json
        kind: package-exports
      - path: tsconfig.build.json
        kind: declaration-config
      - path: src/auth-identity-receipt.ts
        kind: public-library-runtime
      - path: src/batch.ts
        kind: public-library-runtime
      - path: src/lib/batch/**
        kind: public-library-internal-runtime
      - path: src/command-spec.ts
        kind: public-library-runtime
      - path: src/runtime.ts
        kind: public-library-runtime
      - path: src/lib/state-lock.ts
        kind: public-library-lock-runtime
      - path: src/lib/dataset-save-draft-run.ts
        kind: public-library-dogfood
      - path: test/dataset-save-draft-execution-contract.test.ts
        kind: public-library-dogfood-proof
      - path: test/public-auth-identity-receipt.test.ts
        kind: public-library-proof
      - path: test/public-batch*.test.ts
        kind: public-library-proof
      - path: test/public-command-spec.test.ts
        kind: public-library-proof
      - path: test/toolchain-contract.test.mjs
        kind: packed-consumer-proof
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Supported package subpaths, canonical authority contracts, generic scheduling, mutation recovery, and run-directory locks are public API and must remain aligned with package and consumer proof.
  - id: cli-runtime-distribution-contract
    scope: repo
    repo: cli
    triggers:
      - path: src/runtime.ts
        kind: public-runtime-descriptor
      - path: src/lib/runtime/**
        kind: runtime-distribution-owner
      - path: src/main.ts
        kind: runtime-host-admission
      - path: assets/runtime/**
        kind: runtime-machine-contract
      - path: scripts/bootstrap/**
        kind: runtime-bootstrap
      - path: test/runtime-*.test.ts
        kind: runtime-proof
      - path: docs/agents/runtime-distribution-contract.md
        kind: runtime-contract
    requiredDocs:
      - path: docs/agents/runtime-distribution-contract.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Runtime identity, component trust, host admission and cache/bootstrap behavior must remain distinct from data authorization and product task state.
  - id: cli-remote-session-contract
    scope: repo
    repo: cli
    triggers:
      - path: .env.example
        kind: env-template
      - path: src/auth-identity-receipt.ts
        kind: auth-public-parser
      - path: src/lib/auth-identity-receipt.ts
        kind: auth-runtime
      - path: src/lib/dotenv.ts
        kind: env-loading
      - path: src/lib/env.ts
        kind: env-contract
      - path: src/lib/http.ts
        kind: transport
      - path: src/lib/kb-search.ts
        kind: remote-adapter
      - path: src/lib/llm.ts
        kind: remote-adapter
      - path: src/lib/oauth-loopback.ts
        kind: oauth-loopback-runtime
      - path: src/lib/oauth-pkce.ts
        kind: oauth-protocol-runtime
      - path: src/lib/remote.ts
        kind: remote-adapter
      - path: src/lib/supabase-client.ts
        kind: remote-adapter
      - path: src/lib/supabase-data-api-contract.ts
        kind: remote-adapter
      - path: src/lib/supabase-data-api-replay.ts
        kind: remote-adapter
      - path: src/lib/supabase-json-ordered-write.ts
        kind: remote-adapter
      - path: src/lib/supabase-rest.ts
        kind: remote-adapter
      - path: src/lib/supabase-session.ts
        kind: session-runtime
      - path: src/lib/unstructured.ts
        kind: remote-adapter
      - path: src/lib/*-api-*.ts
        kind: remote-adapter
      - path: src/lib/credential-safety.ts
        kind: auth-runtime
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/agents/repo-architecture.md
        mode: review_or_update
      - path: DEV_CN.md
        mode: review_or_update
    reason: Session, env, and remote adapter changes alter the CLI-owned runtime boundary and proof assumptions.
  - id: cli-private-live-case-contract
    scope: repo
    repo: cli
    triggers:
      - path: scripts/live/**
        kind: private-test-harness
      - path: test/live-oauth-harness.test.ts
        kind: repo-test
      - path: docs/agents/live-case-testing.md
        kind: deep-doc
    requiredDocs:
      - path: docs/agents/live-case-testing.md
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: Private real-account evidence must stay isolated from public authentication, artifacts, dependencies and CI.
  - id: cli-validation-and-release-contract
    scope: repo
    repo: cli
    triggers:
      - path: src/lib/cli-repository-identity.ts
        kind: versioned-release-identity
      - path: .gitignore
        kind: package-manager-guard
      - path: package.json
        kind: runtime-config
      - path: pnpm-workspace.yaml
        kind: package-manager-config
      - path: pnpm-lock.yaml
        kind: dependency-lock
      - path: .nvmrc
        kind: runtime-config
      - path: tsconfig.json
        kind: runtime-config
      - path: tsconfig.build.json
        kind: runtime-config
      - path: .oxlintrc.json
        kind: lint-config
      - path: test/**
        kind: repo-test
      - path: scripts/**
        kind: validation-or-release-script
      - path: .github/workflows/quality-gate.yml
        kind: ci
      - path: .github/workflows/publish.yml
        kind: ci
      - path: .github/workflows/tag-release-from-merge.yml
        kind: ci
      - path: docs/release-runbook.md
        kind: release-runbook
      - path: docs/release-setup.md
        kind: release-setup
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
      - path: docs/release-runbook.md
        mode: review_or_update
      - path: docs/release-setup.md
        mode: review_or_update
    reason: The single pnpm/TypeScript/Oxlint runtime baseline, package contract, coverage gates, release checks, and publish workflows define how CLI changes are validated and shipped.
  - id: cli-doc-maintenance-contract
    scope: repo
    repo: cli
    triggers:
      - path: .github/workflows/ai-doc-lint.yml
        kind: automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Repo-local documentation maintenance automation must stay aligned with the repo contract and governed-doc rules.
  - id: cli-local-docpact-push-gate
    scope: repo
    repo: cli
    triggers:
      - path: .githooks/pre-push
        kind: local-git-hook
      - path: scripts/docpact
        kind: local-automation
      - path: scripts/docpact-gate.sh
        kind: local-automation
      - path: scripts/install-git-hooks.sh
        kind: local-automation
    requiredDocs:
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/agents/repo-validation.md
        mode: review_or_update
    reason: Local push documentation governance gates must stay aligned with repo validation guidance and docpact configuration.

  - id: cli-exact-reference-intent-contract
    scope: repo
    repo: cli
    triggers:
      - path: docs/agents/exact-reference-intent-contract.md
        kind: doc-contract
      - path: src/lib/dataset-exact-reference-*.ts
        kind: command-logic
      - path: src/lib/dataset-remote-verify.ts
        kind: command-logic
      - path: test/dataset-exact-reference-intent.test.ts
        kind: validation
    requiredDocs:
      - path: docs/agents/exact-reference-intent-contract.md
        mode: review_or_update
    reason: Exact-reference exceptions must retain consumer, actor, content and review binding without changing root or default policy.

